name: Release

# Bumping the version in Cargo.toml and merging to main is the release, as in
# the other Karya apps: once CI passes on that commit, this workflow tags it
# v<version> with karya-karta (the Karya bot app), builds, signs and
# notarizes Bonsai.dmg on the self-hosted Mac, and publishes the GitHub
# release. A commit whose version is already released does nothing. Every
# step skips work that is already done, so "Re-run failed jobs" is safe.
#
# Run it by hand for a dry run (an ad-hoc signed DMG as a workflow artifact,
# with no secrets), or to retry a release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number. Defaults to the GitHub run number.
        required: false
        type: string
      dry_run:
        description: Build and verify an ad-hoc signed DMG, without signing secrets, notarization or a release.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # Only after CI passed on a push to main, or when run by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          version="$(awk -F'"' '/^\[workspace.package\]/ { s = 1; next } /^\[/ { s = 0 } s && /^version *=/ { print $2; exit }' Cargo.toml)"
          tag="v$version"
          sha="$(git rev-parse HEAD)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run of $tag from $sha"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == "false" ]]; then
            echo "$tag is released already; bump the version in Cargo.toml to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tagged="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)"
          if [[ -n "$tagged" && "$tagged" != "$sha" ]]; then
            # An earlier run tagged this version and then failed: finish
            # that release from the tagged commit.
            echo "Finishing $tag from ${tagged:0:7}, where it was tagged."
            echo "sha=$tagged" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $tag"
          echo "release=true" >> "$GITHUB_OUTPUT"

  tag:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # karya-karta pushes the tag, as in gpuicn and Matty: only it may
      # bypass a v* tag ruleset, and GITHUB_TOKEN may not push a ref whose
      # commits change a workflow file.
      - id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KARYA_BOT_APP_ID }}
          private-key: ${{ secrets.KARYA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ steps.bot.outputs.token }}
      - env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [[ -n "$(git ls-remote origin "refs/tags/$TAG")" ]]; then
            echo "$TAG exists"
          else
            git push origin "HEAD:refs/tags/$TAG"
          fi

  dry-run:
    name: Dry-run macOS artifact
    needs: plan
    if: needs.plan.outputs.dry_run == 'true'
    # Karya's self-hosted Mac (the KARYA_MACOS_RUNNER organization variable,
    # as in CI), which has Xcode for codesign, notarytool and stapler.
    runs-on: ${{ fromJSON(vars.KARYA_MACOS_RUNNER || '"macos-15"') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: karyalabs/.github/actions/self-hosted-prep@v1
      # Keep in step with rust-toolchain.toml.
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          cargo --version
          curl --version | sed -n '1p'
          jq --version

      - name: Resolve release metadata
        run: |
          version="${{ needs.plan.outputs.version }}"
          build_number="${{ inputs.build_number }}"
          if [[ -z "$build_number" ]]; then
            build_number="${{ github.run_number }}"
          fi
          {
            echo "BONSAI_VERSION=$version"
            echo "BONSAI_BUILD_NUMBER=$build_number"
            echo "BONSAI_RELEASE_DRY_RUN=true"
          } >> "$GITHUB_ENV"

      - name: Validate source
        run: make check

      - name: Build dry-run archive
        run: make release-verify-archive

      - name: Verify release artifacts
        run: make release-verify-artifacts

      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bonsai-${{ env.BONSAI_VERSION }}-${{ env.BONSAI_BUILD_NUMBER }}-dry-run
          path: |
            dist/release/Bonsai.dmg
            dist/release/Bonsai.release.plist
          if-no-files-found: error
          retention-days: 7

  notarize:
    name: Notarized macOS artifact
    needs: [plan, tag]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    # Karya's self-hosted Mac (the KARYA_MACOS_RUNNER organization variable,
    # as in CI), which has Xcode for codesign, notarytool and stapler.
    runs-on: ${{ fromJSON(vars.KARYA_MACOS_RUNNER || '"macos-15"') }}
    environment: release

    env:
      BONSAI_CODESIGN_IDENTITY: ${{ secrets.BONSAI_CODESIGN_IDENTITY }}
      BONSAI_NOTARY_PROFILE: bonsai-ci-notary

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: karyalabs/.github/actions/self-hosted-prep@v1
      # Keep in step with rust-toolchain.toml.
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          cargo --version
          curl --version | sed -n '1p'
          jq --version

      - name: Resolve release metadata
        run: |
          version="${{ needs.plan.outputs.version }}"
          build_number="${{ inputs.build_number }}"
          if [[ -z "$build_number" ]]; then
            build_number="${{ github.run_number }}"
          fi
          {
            echo "BONSAI_VERSION=$version"
            echo "BONSAI_BUILD_NUMBER=$build_number"
            echo "BONSAI_RELEASE_DRY_RUN=false"
            echo "BONSAI_NOTARY_KEYCHAIN=$RUNNER_TEMP/bonsai-signing.keychain-db"
          } >> "$GITHUB_ENV"

      - name: Check release secrets
        env:
          BONSAI_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.BONSAI_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          BONSAI_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.BONSAI_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          BONSAI_NOTARY_APPLE_ID: ${{ secrets.BONSAI_NOTARY_APPLE_ID }}
          BONSAI_NOTARY_APP_PASSWORD: ${{ secrets.BONSAI_NOTARY_APP_PASSWORD }}
          BONSAI_NOTARY_TEAM_ID: ${{ secrets.BONSAI_NOTARY_TEAM_ID }}
        run: |
          missing=0
          for name in \
            BONSAI_CODESIGN_IDENTITY \
            BONSAI_DEVELOPER_ID_CERTIFICATE_BASE64 \
            BONSAI_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            BONSAI_NOTARY_APPLE_ID \
            BONSAI_NOTARY_APP_PASSWORD \
            BONSAI_NOTARY_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create signing keychain
        env:
          BONSAI_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.BONSAI_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          BONSAI_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.BONSAI_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$BONSAI_NOTARY_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$BONSAI_NOTARY_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$BONSAI_NOTARY_KEYCHAIN"
          security list-keychains -d user -s "$BONSAI_NOTARY_KEYCHAIN"
          security default-keychain -s "$BONSAI_NOTARY_KEYCHAIN"

          developer_id_g2_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --show-error --silent --location \
            --retry 3 \
            --output "$developer_id_g2_path" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$developer_id_g2_path" \
            -k "$BONSAI_NOTARY_KEYCHAIN" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          certificate_path="$RUNNER_TEMP/bonsai-developer-id.p12"
          printf '%s' "$BONSAI_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security import "$certificate_path" \
            -k "$BONSAI_NOTARY_KEYCHAIN" \
            -P "$BONSAI_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$BONSAI_NOTARY_KEYCHAIN"
          rm -f "$certificate_path" "$developer_id_g2_path"

      - name: Store notarization credentials
        env:
          BONSAI_NOTARY_APPLE_ID: ${{ secrets.BONSAI_NOTARY_APPLE_ID }}
          BONSAI_NOTARY_APP_PASSWORD: ${{ secrets.BONSAI_NOTARY_APP_PASSWORD }}
          BONSAI_NOTARY_TEAM_ID: ${{ secrets.BONSAI_NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "$BONSAI_NOTARY_PROFILE" \
            --apple-id "$BONSAI_NOTARY_APPLE_ID" \
            --team-id "$BONSAI_NOTARY_TEAM_ID" \
            --password "$BONSAI_NOTARY_APP_PASSWORD" \
            --keychain "$BONSAI_NOTARY_KEYCHAIN"

      - name: Check release credentials
        run: |
          make release-doctor
          make release-check-credentials

      - name: Build signed and notarized archive
        run: make release-notarize

      - name: Verify release artifacts
        run: make release-verify-artifacts

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bonsai-${{ env.BONSAI_VERSION }}-${{ env.BONSAI_BUILD_NUMBER }}
          path: |
            dist/release/Bonsai.dmg
            dist/release/Bonsai.release.plist
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BONSAI_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BONSAI_RELEASE_PUBLISH: "true"
          GITHUB_SHA: ${{ needs.plan.outputs.sha }}
        run: make release-draft

      - name: Clean up signing keychain
        if: always()
        run: |
          if [[ -n "${BONSAI_NOTARY_KEYCHAIN:-}" && -f "$BONSAI_NOTARY_KEYCHAIN" ]]; then
            security delete-keychain "$BONSAI_NOTARY_KEYCHAIN"
          fi
