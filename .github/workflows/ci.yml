name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # Karya's self-hosted macOS runner when KARYA_MACOS_RUNNER is set, else GitHub's.
    runs-on: ${{ fromJSON(vars.KARYA_MACOS_RUNNER || '"macos-15"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: karyalabs/.github/actions/self-hosted-prep@v1
      # Keep in step with rust-toolchain.toml.
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --features bonsai/runtime_shaders -- -D warnings
      - run: cargo test --workspace --locked --features bonsai/runtime_shaders

  core:
    # The GPUI-free crates also build and test on Linux, which is quicker.
    runs-on: ${{ fromJSON(vars.KARYA_LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: karyalabs/.github/actions/self-hosted-prep@v1
      # Keep in step with rust-toolchain.toml.
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p bonsai-git -p bonsai-graph -p bonsai-providers -p bonsai-keychain
